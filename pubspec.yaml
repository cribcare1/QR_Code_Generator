name: qr_code
description: A Flutter project to generate and scan encrypted QR codes.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.1.3
  encrypt: ^5.0.3
  http: ^1.6.0
  google_maps_flutter: ^2.14.0
  flutter_riverpod: ^3.0.3
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  google_places_flutter: ^2.1.1
  pretty_qr_code: ^3.5.0
  screenshot: ^3.0.0
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  pdf: ^3.11.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
